{{ with .Site.Params.call_to_action }}
  {{ if .enable }}
  <section class="site-cta" style='background-image: url("{{ .background_image | absURL }}");'>
    <div class="container">
      <div class="row">
        <div class="col-12 text-center">
          <h1 class="site-cta-title">{{ .title }}</h1>
          <ul class="site-cta-buttons">
            <li>
              <a href="{{ .primary_button_url | absURL }}" class="btn btn-secondary">
                <span class="btn-area">
                  <span data-text="{{ .primary_button }}">
                    {{ .primary_button }}
                  </span>
                </span>
              </a>
            </li>
            <li>
              <a href="{{ .secondary_button_url | absURL }}" class="btn btn-primary">
                <span class="btn-area">
                  <span data-text="{{ .secondary_button }}">
                    {{ .secondary_button }}
                  </span>
                </span>
              </a>
            </li>
            {{ with .tertiary_button }}
            <li>
              <a href="{{ $.Site.Params.call_to_action.tertiary_button_url | absURL }}" class="btn btn-secondary">
                <span class="btn-area">
                  <span data-text="{{ . }}">
                    {{ . }}
                  </span>
                </span>
              </a>
            </li>
            {{ end }}
          </ul>
          {{ with .sub_link_url }}
          <a href="{{ . | absURL }}" class="site-cta-sublink">
            {{ $.Site.Params.call_to_action.sub_link_text }} &rarr;
          </a>
          {{ end }}
        </div>
      </div>
    </div>
  </section>
  {{ end }}
{{ end }}
