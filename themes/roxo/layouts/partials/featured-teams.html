{{ with .Site.Params.featured_teams }}
  {{ if .enable }}
  <section class="featured-teams" id="teams">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="section-title text-center">
            <h2>{{ .title }}</h2>
            <p>{{ .subtitle }}</p>
          </div>
        </div>
      </div>

      <div class="featured-teams-grid">
        {{ range first 3 (where $.Site.RegularPages "Type" "teams") }}
        <div class="featured-teams-card">
          <div class="featured-teams-card-thumb">
            <img src="{{ .Params.feature_image | absURL }}" alt="{{ .Title }}">
          </div>
          <div class="featured-teams-card-body">
            <span class="featured-teams-card-badge">{{ .Params.author }}</span>
            <h3>{{ .Title }}</h3>
            <p>{{ .Summary }}</p>
            <a href="{{ .Permalink }}" class="featured-teams-card-link">
              Learn more
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
        </div>
        {{ end }}
      </div>

      <div class="featured-teams-footer">
        <a href="/teams" class="site-project-cta">View all teams</a>
      </div>
    </div>
  </section>
  {{ end }}
{{ end }}
