{{ with .Site.Params.metrics }}
  {{ if .enable }}
  <section class="metrics-strip">
    <div class="container">
      <div class="metrics-strip-grid">
        {{ range .items }}
        <div class="metrics-strip-item">
          <span class="metrics-strip-number">{{ .number }}</span>
          <span class="metrics-strip-label">{{ .label }}</span>
        </div>
        {{ end }}
      </div>
    </div>
  </section>
  {{ end }}
{{ end }}
