baseURL       = "https://igem.berkeley.edu/"
languageCode  = "en-us"
title         = "iGEM at Berkeley"
theme         = "roxo"
summarylength = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Site Menus
[menu]
  # Navbar Menus
  [[menu.nav]]
    name    = "About"
    url     = "about"
    weight  = 1
  [[menu.nav]]
    name    = "Members"
    url     = "members"
    weight  = 2
  [[menu.nav]]
    name    = "Eternals"
    url     = "eternals"
    weight  = 3
  [[menu.nav]]
    name    = "Finance"
    url     = "finance"
    weight  = 4
  [[menu.nav]]
    name    = "Teams"
    url     = "teams"
    weight  = 5
  [[menu.nav]]
    name    = "CUBS"
    url     = "cubs"
    weight  = 6
  [[menu.nav]]
    name    = "BABS"
    url     = "babs"
    weight  = 7
  [[menu.nav]]
    name    = "DeCal"
    url     = "ferb"
    weight  = 8
  [[menu.nav]]
    name    = "Apply"
    url     = "apply"
    weight  = 9

# Site Params
[params]
  logo = "images/logo.png"
  dateFormat = "26 FEB 1994"
  # Meta data
  description = "iGEM at Berkeley"
  author = "iGEM at Berkeley"
  # We're using formspree.io for form handling, paste your formspree url below
  formspreeFormUrl  = "https://formspree.io/myykjpje"

  # Contact Form
  [params.contactForm]
    placeholder_first_name        = "First Name"
    placeholder_last_name         = "Last Name"
    placeholder_email             = "Email"
    placeholder_project_type      = "Project Type"
    placeholder_about_the_project = "About the Project"
    send_message                  = "Send Message"

    [[params.contactForm.projectType]]
      value = "gd"
      title  = "Graphics Design"
    [[params.contactForm.projectType]]
      value = "wd"
      title  = "Web Design"
  
  # Navbar Action Button
  [params.navAction]
    status  = true
    name    = "Join Us"
    url     = "contact"
  

  # Banner Section
  [params.banner]
    enable                = true
    background_image      = "images/backgrounds/retreat.png"
    heading               = "Join us for undergrad-led synthetic biology research, training programs, and a large community of aspiring scientists!"
    tagline               = "iGEM at Berkeley"
    primary_button        = "Apply to join iGEM"
    primary_button_url    = "/apply"
    secondary_button      = "General Member Form"
    secondary_button_url  = "https://docs.google.com/forms/d/e/1FAIpQLSdf3GZ4lHacONnspn08-ca_0arWuRrSkgVZHPoelU54fwIz5A/viewform"
    tertiary_button      = "Contact us on Instagram"
    tertiary_button_url  = "https://www.instagram.com/igematberkeley/"

  [params.featured_teams]
    enable   = true
    title    = "Our Research Teams"
    subtitle = "Student-led wetlab and computational biology projects tackling real synthetic biology problems."

  [params.who_we_are]
    enable     = true
    team_image = "images/about/old_retreat.jpg"
    title      = "Undergrad-led science, open to everyone."
    subtitle   = "iGEM at Berkeley is UC Berkeley's only hands-on undergraduate synthetic biology club. No grad school required."
    cta_text   = "Learn more about us"
    cta_url    = "/about"

    [[params.who_we_are.pillars]]
      icon    = "🔬"
      heading = "Student-Led Research"
      text    = "10 active wetlab and computational biology teams tackle real problems from ideation to publication."

    [[params.who_we_are.pillars]]
      icon    = "📚"
      heading = "Open Education"
      text    = "FERB (BioE 98/198) is our free, zero-prereq DeCal that teaches cloning and synbio fundamentals every semester."

    [[params.who_we_are.pillars]]
      icon    = "🎉"
      heading = "Thriving Community"
      text    = "CUBS, BABS, retreats, and 200+ alumni — the network starts here."

  [params.metrics]
    enable = true

    [[params.metrics.items]]
      number = "10+"
      label  = "Research Teams"

    [[params.metrics.items]]
      number = "200+"
      label  = "Active Members"

    [[params.metrics.items]]
      number = "2"
      label  = "DeCals Per Semester"

    [[params.metrics.items]]
      number = "7+"
      label  = "Years Running"

  [params.explore]
    enable   = true
    title    = "Explore iGEM at Berkeley"
    subtitle = "Find your place in the club — whether you want to pipette, code, organize, or fund the future of biology."

    [[params.explore.cards]]
      icon  = "🧬"
      title = "Research Teams"
      desc  = "Join a wetlab or computational biology team and work on a real semester-long research project."
      url   = "/teams"
      cta   = "See all teams"

    [[params.explore.cards]]
      icon  = "🎓"
      title = "FERB DeCal"
      desc  = "Our free two-semester training program (BioE 98/198) takes you from zero to cloning confidently."
      url   = "/ferb"
      cta   = "Explore the DeCal"

    [[params.explore.cards]]
      icon  = "🏛️"
      title = "Eternals Network"
      desc  = "200+ alumni across biotech, medicine, and academia. Stay connected after Berkeley."
      url   = "/eternals"
      cta   = "Meet the Eternals"

    [[params.explore.cards]]
      icon  = "💼"
      title = "Finance & Partnerships"
      desc  = "Support iGEM research through sponsorship, or join our finance team to manage club operations."
      url   = "/finance"
      cta   = "Partner with us"

    [[params.explore.cards]]
      icon  = "🔭"
      title = "CUBS Symposium"
      desc  = "Our semesterly undergraduate bioengineering poster session at Hearst Memorial Mining Building."
      url   = "/cubs"
      cta   = "Learn about CUBS"

    [[params.explore.cards]]
      icon  = "🌱"
      title = "BABS"
      desc  = "Berkeley Annual Biology Symposium — a cross-org celebration of undergraduate life sciences research."
      url   = "/babs"
      cta   = "Learn about BABS"

    [[params.explore.cards]]
      icon  = "✉️"
      title = "Apply to iGEM"
      desc  = "Applications open every semester. Join a team, the DeCal, or become a general member."
      url   = "/apply"
      cta   = "Apply now"

  [params.find_your_path]
    enable  = true
    eyebrow = "Find Your Place"
    heading = "Where do you fit in?"

    [[params.find_your_path.tiles]]
      icon     = "🔬"
      audience = "I want to do research"
      desc     = "Join a wetlab or computational biology team and work on a real semester-long project with mentorship from day one."
      cta      = "See the teams"
      url      = "/teams"

    [[params.find_your_path.tiles]]
      icon     = "📚"
      audience = "I'm new and want to learn"
      desc     = "FERB (BioE 98) is a free, zero-prereq DeCal that teaches cloning and synbio fundamentals — no experience needed."
      cta      = "Explore FERB"
      url      = "/ferb"

    [[params.find_your_path.tiles]]
      icon     = "💼"
      audience = "I want to support science"
      desc     = "Sponsor our research or join the finance team. Your support keeps student science running every semester."
      cta      = "Partner with us"
      url      = "/finance-be-a-partner"

    [[params.find_your_path.tiles]]
      icon     = "🌐"
      audience = "I want to run the club"
      desc     = "Eternals and Finance teams drive events, brand, partnerships, and funding — keeping student science alive every semester."
      cta      = "See how to join"
      url      = "/apply"

  [params.ops_support]
    enable     = false

  [params.partner_cta]
    enable      = true
    eyebrow     = "Support iGEM Research"
    heading     = "Fund the next generation of student scientists."
    description = "Your sponsorship directly supports wetlab research, reagents, and the next cohort of undergraduate researchers at UC Berkeley."
    button      = "View Sponsorship Opportunities"
    button_url  = "/finance-be-a-partner"
    image       = "images/finance/finance-banner.jpg"

  [params.call_to_action]
    enable              = true
    background_image    = "images/backgrounds/cta-background.jpg"
    title               = "Ready to do real science?"
    primary_button      = "Apply to a Team"
    primary_button_url  = "https://forms.gle/c4TgnW8mzwJ5iUWt8"
    secondary_button    = "Explore the DeCal"
    secondary_button_url = "http://linktr.ee/igematberkeleydecals"
    tertiary_button     = "Become a Sponsor"
    tertiary_button_url = "finance-be-a-partner"
    sub_link_text       = "Just want to stay in the loop?"
    sub_link_url        = "https://docs.google.com/forms/d/e/1FAIpQLSdf3GZ4lHacONnspn08-ca_0arWuRrSkgVZHPoelU54fwIz5A/viewform"
    finance_primary_button      = "Join Our Team"
    finance_primary_button_url  = "finance-join-our-team"
    finance_secondary_button    = "Be A Partner"
    finance_secondary_button_url = "finance-be-a-partner"

  [params.footer]
    # Footer Contact Info
    [params.footer.contactInfo]
      title   = "Contact Us"
      address = "University of California, Berkeley"
      phone   = "directors@igem.berkeley.edu"
      email   = ""
      # Footer Site Map
      [params.footer.sitemap]
        title   = "Site Map"
        [[params.footer.sitemap.link]]
          name = "About"
          url  = "about"
        [[params.footer.sitemap.link]]
          name = "Community"
          url  = "community"
        [[params.footer.sitemap.link]]
          name = "Eternals"
          url  = "eternals"
        [[params.footer.sitemap.link]]
          name = "Finance"
          url  = "finance"
        [[params.footer.sitemap.link]]
          name = "Project Teams"
          url  = "teams"
        [[params.footer.sitemap.link]]
          name = "CUBS"
          url  = "cubs"
        [[params.footer.sitemap.link]]
          name = "BABS"
          url  = "babs"
        [[params.footer.sitemap.link]]
          name = "DeCal"
          url  = "ferb"
      # Footer Social Media
      [params.footer.social]
        title   = "Social Media"
        [[params.footer.social.link]]
          name = "Instagram"
          url  = "https://www.instagram.com/igematberkeley"
        [[params.footer.social.link]]
          name = "Facebook"
          url  = "https://www.facebook.com/igematberk/"
        [[params.footer.social.link]]
          name = "Twitter"
          url  = "https://twitter.com/igematberkeley"
        [[params.footer.social.link]]
          name = "GitHub"
          url  = "https://github.com/igematberkeley"
      # Footer Sponsor
      [params.footer.sponsor]
        title       = "Thank You to Our Sponsors:"
        description = "<a href='http://mcb.berkeley.edu/labs/botchan/'>Botchan Lab</a> | Rulison Family | Tonkomo LLC | Pande Family | Spiegel Family | Jacob Pruess | Kanjana Taedullayasatit | Stuart Russell | Sophie Hahn | Lin Tan | <a href='https://www.geneious.com'>Geneious</a> | Michaela Healton | Shen & Namiko Chen"
      # Footer Service
      [params.footer.service]
        title       = "Student Group Disclaimer:"
        description = "We are a student group acting independently of the University of California. We take full responsibility for our organization and this web site."
      
        
